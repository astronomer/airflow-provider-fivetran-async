name: test-unprivileged

on:
  push: # Run on pushes to the default branch
    branches: ['main']
  # Jobs here need no secrets (static checks, unit tests), so they run under the plain
  # `pull_request` event: fork PRs get a read-only, secret-less token, which means checking
  # out and running the PR's code is not a privileged operation and needs no Authorize
  # approval gate. Jobs that need secrets (integration tests, PyPI publish) stay in ci.yml,
  # gated behind the Authorize environment and pull_request_target.
  pull_request:
    branches: ['main']

# This allows a subsequent queued workflow run to interrupt and cancel previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Static-Check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          architecture: "x64"

      - run: pip3 install "hatch>=1.14.2"
      - run: hatch run tests.py3.11-2.10:static-check

  Run-Unit-Tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        airflow-version: [ "2.9", "2.10", "3.0", "3.1", "3.2" ]
        exclude:
          # Python 3.13 is only supported by Apache Airflow >= 3.0.
          - python-version: "3.13"
            airflow-version: "2.9"
          - python-version: "3.13"
            airflow-version: "2.10"
          # Python 3.14 is only supported by Apache Airflow >= 3.2.
          - python-version: "3.14"
            airflow-version: "2.9"
          - python-version: "3.14"
            airflow-version: "2.10"
          - python-version: "3.14"
            airflow-version: "3.0"
          - python-version: "3.14"
            airflow-version: "3.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            .local/share/hatch/
          key: unit-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('fivetran_provider_async/__init__.py') }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages and dependencies
        run: |
          python -m pip install uv
          uv pip install --system "hatch>=1.14.2"
          hatch -e tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }} run pip freeze

      - name: Test Airflow ${{ matrix.airflow-version }} and Python ${{ matrix.python-version }}
        run: |
          hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}:test

      - name: Upload coverage to Github
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit-test-${{ matrix.python-version }}-${{ matrix.airflow-version }}
          path: .coverage
          include-hidden-files: true
