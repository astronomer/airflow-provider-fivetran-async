name: Build and test
on:
  push:
    branches: ['main']
  # Only jobs that need secrets (Run-Integration-Tests) or that only ever run on release/push
  # (Publish-Package) live here. They run on pull_request_target so fork PRs get access to the
  # FIVETRAN_DEFAULT secret, gated behind the Authorize job's `external` environment approval.
  # Jobs that need no secrets (Static-Check, Run-Unit-Tests) run under the plain `pull_request`
  # trigger in test-unprivileged.yml instead, without that approval gate.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: ['main']
  release:
    types: [ 'created' ]

# This allows a subsequent queued workflow run to interrupt and cancel previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Authorize:
    environment: ${{ github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'external' || 'internal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: true

  Run-Integration-Tests:
    needs: Authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        # TODO: Enable tests for others version of Airflow
        # https://github.com/astronomer/airflow-provider-fivetran-async/issues/166
        airflow-version: [ "2.9", "2.10", "3.0", "3.1", "3.2" ]
        exclude:
          # Python 3.13 is only supported by Apache Airflow >= 3.0.
          - python-version: "3.13"
            airflow-version: "2.9"
          - python-version: "3.13"
            airflow-version: "2.10"
          # Python 3.14 is only supported by Apache Airflow >= 3.2.
          - python-version: "3.14"
            airflow-version: "2.9"
          - python-version: "3.14"
            airflow-version: "2.10"
          - python-version: "3.14"
            airflow-version: "3.0"
          - python-version: "3.14"
            airflow-version: "3.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      # Restore-only: this job runs on pull_request_target with fork code (allow-unsafe-pr-checkout
      # above), so it must never *save* a cache entry built from untrusted code — a poisoned entry
      # would then be silently restored into a later trusted (push-to-main) run. Saving happens in
      # a separate step below, gated to push events only.
      - id: cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            .local/share/hatch/
          key: integration-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('fivetran_provider_async/__init__.py') }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages and dependencies
        run: |
          python -m pip install uv
          uv pip install --system "hatch>=1.14.2"
          hatch -e tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }} run pip freeze

      - name: Test Airflow ${{ matrix.airflow-version }} and Python ${{ matrix.python-version }}
        run: |
          hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}:test-integration-setup
          hatch run tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}:test-integration
        env:
          AIRFLOW_HOME: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/examples:$PYTHONPATH
          AIRFLOW_CONN_FIVETRAN_DEFAULT: ${{ secrets.FIVETRAN_DEFAULT }}
          CI_CONNECTOR_ID: industries_leukemia
          CI_CONNECTOR_NAME: ci_airflow_provider_fivetran_async
          CI_DESTINATION_NAME: integration_team_ci

      - name: Upload coverage to Github
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-integration-test-${{ matrix.python-version }}-${{ matrix.airflow-version }}
          path: .coverage
          include-hidden-files: true

      # Only save on push (trusted, no fork code) so a fork PR run can never write a poisoned
      # cache entry that a later trusted run would restore.
      - name: Save cache
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            .local/share/hatch/
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  Publish-Package:
    if: github.event_name == 'release'
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    needs:
      - Run-Integration-Tests
      - Authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/airflow-provider-fivetran-async
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Verify Git Tag and package version
        run: python3 .github/scripts/verify_tag_and_version.py

      - name: Build source and wheel distributions
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # v1.12.4
